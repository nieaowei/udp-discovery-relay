[package]
name = "udp-discovery-relay"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Source-preserving IPv4 UDP discovery relay for routed networks"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
